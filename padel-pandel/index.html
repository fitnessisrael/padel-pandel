<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>פאדל פנדל</title>
<meta name="theme-color" content="#0a0c0a">
<link rel="icon" href="logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Rubik:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0c0a;--card:#131614;--card2:#181c18;--lime:#c8e52f;--limeglow:rgba(200,229,47,.32);--line:rgba(255,255,255,.08);--limeline:rgba(200,229,47,.38);--txt:#f3f6ee;--mut:#8c9488;--red:#ff6161;--num:'Outfit','Rubik',sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:'Rubik',system-ui,sans-serif;overflow-x:hidden}
body{min-height:100vh;padding-bottom:104px;background:radial-gradient(800px 420px at 100% -8%,rgba(200,229,47,.13),transparent 60%),radial-gradient(600px 380px at -5% 38%,rgba(120,170,40,.08),transparent 60%),var(--bg)}
button{font-family:inherit;cursor:pointer;border:0;color:inherit;background:none}
input,select{font-family:inherit;font-size:16px;color:var(--txt);background:#0d100d;border:1px solid var(--line);border-radius:16px;padding:0 16px;height:52px;width:100%;max-width:100%;min-width:0;outline:none;display:block;-webkit-appearance:none;appearance:none}
input[type=date]{text-align:right;line-height:50px}
input[type=date]::-webkit-date-and-time-value{text-align:right}
input:focus,select:focus{border-color:var(--limeline);box-shadow:0 0 0 3px rgba(200,229,47,.08)}
input[readonly]{color:var(--lime);background:#10140d;border-style:dashed}
.ic{display:block;flex:none}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px;max-width:1100px;margin:0 auto}
.who{display:flex;align-items:center;gap:12px;min-width:0}
.who b{display:block;font-size:17px;font-weight:700;line-height:1.2}
.who small{display:block;color:var(--mut);font-size:12.5px;margin-top:2px}
.tbtns{display:flex;gap:8px}
.ibtn{width:46px;height:46px;border-radius:50%;border:1.5px solid rgba(255,255,255,.14);display:grid;place-items:center;color:#d9dfd2;background:rgba(255,255,255,.02)}
.ibtn.lime{border-color:var(--limeline);color:var(--lime);box-shadow:0 0 18px rgba(200,229,47,.14)}
.pill{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--limeline);color:var(--lime);padding:11px 18px;border-radius:999px;font-weight:600;font-size:14px;box-shadow:0 0 18px rgba(200,229,47,.12)}
.btn{display:flex;align-items:center;justify-content:space-between;gap:14px;background:var(--lime);color:#10150a;font-weight:700;font-size:16px;padding:6px 22px 6px 6px;border-radius:999px;box-shadow:0 0 34px var(--limeglow);transition:transform .15s;text-decoration:none;min-width:150px}
.btn:active{transform:scale(.97)}
.btn .go{width:46px;height:46px;border-radius:50%;border:2px solid #10150a;display:grid;place-items:center;background:#171c0e;color:var(--lime);font-style:normal}
.btn.ghost{background:transparent;color:var(--lime);border:1.5px solid var(--lime);box-shadow:none;padding:4px 20px 4px 4px}
.btn.ghost .go{border-color:var(--lime);background:transparent}
.btn.sm{display:inline-flex;justify-content:center;gap:8px;padding:0 20px;height:44px;font-size:14px;min-width:0;box-shadow:0 0 22px rgba(200,229,47,.22)}
.btn.sm.ghost{box-shadow:none;padding:0 18px}
.btn.red{background:transparent;color:var(--red);border:1.5px solid var(--red);box-shadow:none}
.sh{display:flex;align-items:center;justify-content:space-between;margin:30px 0 14px}
.sh h2{margin:0;font-size:21px;font-weight:700}
.sh a,.sh span.more{color:var(--mut);font-size:14px;text-decoration:none}
.sub{color:var(--mut);margin:-6px 0 14px;font-size:14px}
.hero{position:relative;border-radius:30px;overflow:hidden;min-height:560px;display:flex;align-items:flex-end;background:#000 url(hero1.jpg) center 30%/cover;border:1px solid var(--line)}
.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,12,10,.2),rgba(10,12,10,.5) 40%,#0a0c0a 92%)}
.hero .in{position:relative;padding:24px 22px;width:100%}
.hero .lg{position:absolute;top:20px;right:20px;width:84px;border-radius:20px;box-shadow:0 0 40px var(--limeglow);border:1px solid var(--limeline)}
.dash{display:flex;gap:6px;margin-bottom:18px}
.dash i{width:26px;height:3.5px;border-radius:3px;background:rgba(255,255,255,.35)}
.dash i.on{background:var(--lime);box-shadow:0 0 12px var(--limeglow)}
.hero h1{margin:0;font-size:clamp(34px,8.4vw,58px);font-weight:800;line-height:1.08}
.hero h1 span{color:var(--lime);text-shadow:0 0 30px var(--limeglow)}
.hero p{color:#c7d0c1;margin:12px 0 22px;font-size:15.5px;line-height:1.5;max-width:420px}
.hero .row{display:grid;gap:12px;max-width:420px}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px 8px;text-align:center}
.chip b{display:block;font-size:28px;color:var(--lime);font-family:var(--num);font-weight:700;text-shadow:0 0 18px rgba(200,229,47,.25)}
.chip span{font-size:13px;color:var(--mut)}
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:22px;padding:16px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,1fr)}
@media(min-width:760px){.g2{grid-template-columns:repeat(4,1fr)}.hero{min-height:520px}}
.avr{display:inline-block;width:var(--s);height:var(--s);border-radius:50%;padding:2.5px;background:linear-gradient(150deg,var(--lime),#3b4d12);box-shadow:0 0 16px rgba(200,229,47,.3);flex:none}
.avr>span{display:block;width:100%;height:100%;border-radius:50%;overflow:hidden;background:#1b211a}
.avr img{width:100%;height:100%;object-fit:cover;display:block}
.avr svg{width:100%;height:100%;display:block}
.avw{display:inline-block;filter:drop-shadow(0 0 12px rgba(200,229,47,.4));flex:none}
.av{display:block;width:var(--s);height:calc(var(--s)*1.14);clip-path:polygon(50% 0,100% 24%,100% 76%,50% 100%,0 76%,0 24%);background:linear-gradient(160deg,var(--lime),#2b3c0c);padding:3px}
.av>span{display:block;width:100%;height:100%;clip-path:polygon(50% 0,100% 24%,100% 76%,50% 100%,0 76%,0 24%);background:radial-gradient(circle at 50% 30%,#26331f,#0c120b);overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av svg{width:100%;height:100%;display:block}
.pcard{position:relative;background:linear-gradient(165deg,#1a2217,#0f130f 72%);border:1px solid var(--line);border-radius:24px;padding:18px 10px 14px;text-align:center;cursor:pointer;transition:transform .12s ease-out,box-shadow .2s;overflow:hidden}
.pcard:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at var(--mx,50%) var(--my,0%),rgba(200,229,47,.2),transparent 55%);pointer-events:none}
.pcard:hover{box-shadow:0 14px 40px rgba(200,229,47,.14)}
.pcard .rk{position:absolute;top:12px;right:14px;font-family:var(--num);font-weight:700;color:var(--lime);font-size:13px}
.pcard .nm{font-weight:700;font-size:16px;margin-top:8px}
.pcard .cr{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:6px;color:var(--lime);font-family:var(--num);font-weight:700;font-size:24px;text-shadow:0 0 16px rgba(200,229,47,.3)}
.pcard .wl{color:var(--mut);font-size:12px;margin-top:2px}
.pcard.me{border-color:var(--limeline)}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:10px;align-items:end}
.podium .pcard:nth-child(2){padding-top:26px;border-color:var(--limeline);box-shadow:0 0 40px rgba(200,229,47,.16)}
.row-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:20px;background:var(--card);border:1px solid var(--line)}
.row-item+.row-item{margin-top:8px}
.row-item.click{cursor:pointer}
.row-item .n{flex:1;font-weight:600;min-width:0}
.row-item .n small{display:block;color:var(--mut);font-weight:400;font-size:12.5px;margin-top:2px}
.rkn{width:24px;text-align:center;font-family:var(--num);color:var(--mut);font-weight:700}
.crw{display:inline-flex;align-items:center;gap:6px;color:var(--lime);font-family:var(--num);font-weight:700;font-size:17px;background:rgba(200,229,47,.1);border:1px solid var(--limeline);padding:5px 12px;border-radius:999px}
.upc{display:grid;grid-template-columns:1fr 118px;gap:14px;align-items:stretch;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:12px;text-decoration:none;color:inherit;cursor:pointer}
.upc+.upc{margin-top:12px}
.upc .l{display:flex;flex-direction:column;justify-content:center;gap:6px;padding:4px 6px}
.upc .k{color:var(--lime);font-size:13px;font-weight:600}
.upc .d{font-size:18px;font-weight:700}
.upc .s{color:var(--mut);font-size:13px;display:flex;align-items:center;gap:6px}
.upc .im{border-radius:16px;background:#000 center/cover;min-height:100px}
.upc .avs{display:flex;margin-top:6px}
.upc .avs .avr{margin-inline-end:-10px}
.badge{display:inline-block;font-size:11.5px;font-weight:700;padding:4px 11px;border-radius:999px;background:rgba(200,229,47,.1);color:var(--lime);border:1px solid var(--limeline)}
.badge.final{background:var(--lime);color:#10150a;border-color:var(--lime)}
.badge.semi{background:rgba(120,170,255,.12);color:#9cc0ff;border-color:rgba(120,170,255,.3)}
.badge.third{background:rgba(255,170,80,.1);color:#ffb870;border-color:rgba(255,170,80,.3)}
.match{padding:14px;border-radius:22px;background:var(--card);border:1px solid var(--line);cursor:default}
.match[data-act]{cursor:pointer}
.match+.match{margin-top:10px}
.mt{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;color:var(--mut)}
.vsr{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px}
.team{display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center;font-size:13px;font-weight:600;position:relative}
.team .pr{display:flex}
.team .pr .avr+.avr{margin-inline-start:-14px}
.team:not(.win) .avr{background:none;border:1.5px dashed #4a5146;box-shadow:none;padding:2px;opacity:.85}
.team.win{color:var(--lime)}
.team .wb{display:inline-flex}
.mid{text-align:center;min-width:76px}
.vs{font-family:var(--num);font-style:italic;font-weight:800;font-size:22px;color:var(--lime);text-shadow:0 0 18px var(--limeglow);line-height:1}
.score{font-family:var(--num);font-weight:700;font-size:26px;direction:ltr;margin-top:6px}
.tbl{width:100%;border-collapse:separate;border-spacing:0 8px}
.tbl td{background:var(--card);padding:10px 12px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.tbl td:first-child{border-radius:0 18px 18px 0;border-right:1px solid var(--line)}
.tbl td:last-child{border-radius:18px 0 0 18px;border-left:1px solid var(--line)}
.tbl .p{display:flex;align-items:center;gap:10px;font-weight:600}
.nav{position:fixed;bottom:max(14px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:8px;padding:8px;background:rgba(18,21,18,.92);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:999px;z-index:20;box-shadow:0 12px 40px rgba(0,0,0,.6),0 0 30px rgba(200,229,47,.07)}
.nav a{display:flex;align-items:center;gap:8px;height:50px;min-width:50px;justify-content:center;border-radius:999px;border:1.5px solid rgba(255,255,255,.14);color:#cfd6c8;text-decoration:none;font-size:13.5px;font-weight:600;padding:0 14px}
.nav a span{display:none}
.nav a.on{border-color:var(--limeline);background:rgba(200,229,47,.1);color:var(--lime);box-shadow:inset 0 0 18px rgba(200,229,47,.12)}
.nav a.on span{display:inline}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(4px);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{background:#0e110e;border:1px solid var(--line);border-radius:28px 28px 0 0;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;overflow-x:hidden;padding:20px 18px calc(24px + env(safe-area-inset-bottom));animation:up .25s ease-out}
@media(min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:28px}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes fade{from{opacity:0}}
.sheet h3{margin:0 0 14px;font-size:21px;font-weight:700;padding-inline-start:0;padding-right:50px}
.xrow{position:sticky;top:0;height:0;z-index:5}
.xbtn{position:absolute;right:-4px;top:-8px;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;background:rgba(30,34,30,.92);border:1.5px solid rgba(255,255,255,.28);box-shadow:0 4px 16px rgba(0,0,0,.5)}
.lbl{display:block;font-size:13px;color:var(--mut);margin:16px 0 7px}
.pick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pk{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:10px 4px;text-align:center;font-size:12px;font-weight:600;position:relative;cursor:pointer}
.pk.on{border-color:var(--limeline);background:rgba(200,229,47,.08)}
.pk .ck{position:absolute;top:6px;left:6px;width:18px;height:18px;border-radius:50%;background:var(--lime);color:#10150a;display:grid;place-items:center}
.pk .avr{display:block;margin:0 auto 5px}
.sc{display:flex;align-items:center;justify-content:center;gap:10px}
.sc button{width:46px;height:46px;border-radius:50%;border:1.5px solid rgba(255,255,255,.16);display:grid;place-items:center;color:var(--lime)}
.sc output{font-family:var(--num);font-size:34px;font-weight:700;min-width:46px;text-align:center}
.tb{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tb>div{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px}
.tb h4{margin:0 0 8px;font-size:13px;color:var(--lime);font-weight:600}
.tb select+select{margin-top:8px}
.chs{display:flex;gap:8px;flex-wrap:wrap}
.chs button{padding:10px 16px;border-radius:999px;border:1.5px solid rgba(255,255,255,.14);font-weight:600;font-size:14px}
.chs button.on{background:var(--lime);color:#10150a;border-color:var(--lime)}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gal img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:16px;border:1px solid var(--line);cursor:pointer}
.empty{color:var(--mut);text-align:center;padding:26px;border:1px dashed rgba(255,255,255,.14);border-radius:20px}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--lime);color:#10150a;font-weight:700;padding:12px 22px;border-radius:999px;z-index:99;box-shadow:0 8px 30px rgba(0,0,0,.5),0 0 30px var(--limeglow);animation:fade .2s;white-space:nowrap}
.toast.err{background:var(--red);color:#fff}
.big3d{display:flex;justify-content:center;padding:6px 0}
.ctl{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;align-items:center}
.loader{padding:80px 0;text-align:center;color:var(--mut)}
.adj{margin-top:18px;border:1px solid var(--limeline);border-radius:22px;padding:14px;background:rgba(200,229,47,.04)}
.adj b{display:block;font-size:15px}.adj small{display:block;color:var(--mut);margin:3px 0 12px;font-size:12.5px}
.crop-bg{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;padding:16px}
.crop{background:#0e110e;border:1px solid var(--line);border-radius:28px;padding:18px;width:100%;max-width:360px}
.cvw{position:relative;width:300px;height:300px;margin:6px auto 14px;border-radius:20px;overflow:hidden;touch-action:none;background:#000;max-width:100%}
.cvw canvas{display:block;width:100%;height:100%}
.cvw:after{content:"";position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 400px rgba(0,0,0,.62);border:2px solid var(--lime);pointer-events:none}
.cover{height:170px;border-radius:24px;background:#000 center/cover;border:1px solid var(--line);margin-bottom:14px;position:relative;overflow:hidden}
.cover:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(10,12,10,.85))}
.pp{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 6px;border-radius:18px;border:1.5px solid transparent;cursor:pointer;font-size:13px;font-weight:600;min-width:72px}
.pp.sel{border-color:var(--lime);background:rgba(200,229,47,.1);box-shadow:0 0 18px rgba(200,229,47,.25)}
.team2{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:2px}
.bench{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.deck{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:26px 0 30px}
.pc{width:64px;height:88px;border-radius:14px;background:linear-gradient(160deg,#1b2a18,#0d130d);border:1.5px solid var(--limeline);display:grid;place-items:center;color:var(--lime);box-shadow:0 0 18px rgba(200,229,47,.22);transition:transform .17s ease-in-out}
.deal .pp{animation:deal .45s both}
@keyframes deal{from{opacity:0;transform:translateY(-26px) scale(.6) rotate(-12deg)}}
input[type=range]{padding:0;height:32px;accent-color:var(--lime);border:0;background:none}
</style>
</head>

async function rpc(f,a){
  const r=await fetch(SB+'/rest/v1/rpc/'+f,{method:'POST',headers:{...H,'Content-Type':'application/json'},body:JSON.stringify(a)});
  const t=await r.text();let j;try{j=t?JSON.parse(t):null}catch{j=null}
  if(!r.ok){const m=(j&&j.message)||'';if(m==='not_logged_in'){logout(true)}throw new Error(ERR[m]||'משהו השתבש, נסה שוב')}

function stats(ms){
  const o={};const t=id=>o[id]||(o[id]={w:0,l:0});
  for(const m of ms){const aw=m.score_a>m.score_b;
    for(const id of [m.a1,m.a2])aw?t(id).w++:t(id).l++;
    for(const id of [m.b1,m.b2])aw?t(id).l++:t(id).w++}
  if(ms===S.matches)for(const a of S.adj){const x=t(a.player_id);x.w=Math.max(0,x.w+a.w);x.l=Math.max(0,x.l+a.l)}
  return o;
}
function ranked(ms){
  const st=stats(ms);
  return S.players.map(p=>({p,w:(st[p.id]||{}).w||0,l:(st[p.id]||{}).l||0})).filter(x=>ms===S.matches?true:(x.w+x.l)>0)
   .sort((a,b)=>b.w-a.w||(b.w/(b.w+b.l||1))-(a.w/(a.w+a.l||1))||a.p.name.localeCompare(b.p.name,'he'));

  return long?x.toLocaleDateString('he-IL',{weekday:'long'})+' · '+dd:dd}

/* ---------- photo pick + crop ---------- */
function chooseFile(){return new Promise(res=>{const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=()=>res(i.files[0]||null);i.click()})}
function loadImg(f){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=typeof f==='string'?f:URL.createObjectURL(f)})}
async function pickImage(max){
  const f=await chooseFile();if(!f)return null;const im=await loadImg(f);
  const k=Math.min(1,max/Math.max(im.width,im.height)),w=Math.round(im.width*k),h=Math.round(im.height*k);
  const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);return c.toDataURL('image/jpeg',.74);
}
function cropImage(im){
  return new Promise(res=>{
    const V=300,base=Math.max(V/im.width,V/im.height);let z=1,cx=V/2,cy=V/2;
    $('#cropl').innerHTML=`<div class="crop-bg"><div class="crop"><h3>התאמת התמונה</h3><div class="cvw"><canvas id="cv" width="${V}" height="${V}"></canvas></div><label class="lbl" style="margin:0">זום (אפשר גם לגרור את התמונה)</label><input type="range" id="zm" min="1" max="4" step="0.01" value="1"><div class="ctl">${B('שמור','data-act="cropok"')}${b('ביטול','data-act="cropno"','ghost')}</div></div></div>`;
    const cv=$('#cv'),ctx=cv.getContext('2d');
    const clamp=()=>{const ws=im.width*base*z,hs=im.height*base*z;cx=Math.min(ws/2,Math.max(V-ws/2,cx));cy=Math.min(hs/2,Math.max(V-hs/2,cy))};
    const draw=(c=ctx,k=1)=>{const ws=im.width*base*z,hs=im.height*base*z;c.fillStyle='#000';c.fillRect(0,0,V*k,V*k);c.drawImage(im,(cx-ws/2)*k,(cy-hs/2)*k,ws*k,hs*k)};
    const set=nz=>{z=Math.min(4,Math.max(1,nz));$('#zm').value=z;clamp();draw()};
    draw();$('#zm').oninput=e=>set(+e.target.value);
    const ptr=new Map();let pd=0;
    cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,[e.clientX,e.clientY]);pd=0};
    cv.onpointermove=e=>{if(!ptr.has(e.pointerId))return;const o=ptr.get(e.pointerId);const r=cv.getBoundingClientRect(),sc=V/r.width;
      if(ptr.size===1){cx+=(e.clientX-o[0])*sc;cy+=(e.clientY-o[1])*sc;ptr.set(e.pointerId,[e.clientX,e.clientY]);clamp();draw()}
      else{ptr.set(e.pointerId,[e.clientX,e.clientY]);const a=[...ptr.values()],d=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);if(pd)set(z*d/pd);pd=d}};
    cv.onpointerup=cv.onpointercancel=e=>{ptr.delete(e.pointerId);pd=0};
    cv.onwheel=e=>{e.preventDefault();set(z*(e.deltaY<0?1.08:.93))};
    S.cropOk=()=>{const o=document.createElement('canvas');o.width=o.height=320;draw(o.getContext('2d'),320/V);$('#cropl').innerHTML='';res(o.toDataURL('image/jpeg',.85))};
    S.cropNo=()=>{$('#cropl').innerHTML='';res(null)};
  });
}

function shrinkImg(im,max,q=.8){const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);return c.toDataURL('image/jpeg',q)}
async function pickAvatar(){const f=await chooseFile();if(!f)return null;const im=await loadImg(f);const photo=await cropImage(im);return photo?{photo,src:shrinkImg(im,900)}:null}
async function editAvatar(id){let src=null;try{const r=await rest('padel_photo_src?player_id=eq.'+id+'&select=data');src=r[0]&&r[0].data}catch{}
  src=src||P(id).photo;if(!src)return null;const im=await loadImg(src);const photo=await cropImage(im);return photo?{photo,src:null}:null}
async function saveAvatar(id,r){try{await rpc('padel_save_avatar',{p_token:S.token,p_id:id,p_photo:r.photo,p_src:r.src});await loadAll();playerSheet(id);route();toast('התמונה עודכנה')}catch(e){toast(e.message,1)}}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
/* ---------- pairs ---------- */
const pkey=(a,c)=>[a,c].sort().join('|');
function playedPairs(eid){const s=new Set();for(const m of evMatches(eid)){s.add(pkey(m.a1,m.a2));s.add(pkey(m.b1,m.b2))}return s}
function repeats(o,pl){let n=0;for(let m=0;m+3<o.length;m+=4){if(pl.has(pkey(o[m],o[m+1])))n++;if(pl.has(pkey(o[m+2],o[m+3])))n++}return n}
function pairSheet(eid){
  const ids=evPlayers(eid).map(p=>p.id);
  if(ids.length<4){toast('צריך לפחות 4 שחקנים ביום המשחק. אפשר להוסיף בעריכה',1);return}
  S.pr={eid,order:ids,sel:null,shuf:false,busy:false};
  sheet('<h3>קבע זוגות</h3><div id="pr"></div>');renderPair();
}
function pp(i,deal){const id=S.pr.order[i];return `<div class="pp ${S.pr.sel===i?'sel':''}" data-act="swap" data-i="${i}" ${deal?`style="animation-delay:${i*70}ms"`:''}>${av(P(id),46)}<span>${esc(fn(P(id)))}</span></div>`}
function renderPair(deal){
  const r=S.pr,o=r.order,k=Math.floor(o.length/4),played=playedPairs(r.eid);
  let h=`<p class="sub">לחץ על שחקן ואז על שחקן אחר כדי להחליף ביניהם, או לחץ על ערבב קלפים.</p><div class="${deal?'deal':''}">`;
  for(let m=0;m<k;m++){const i=m*4;const rep=x=>played.has(pkey(o[x],o[x+1]))?'<span class="badge third">כבר שיחקו יחד</span>':'';
    h+=`<div class="match"><div class="mt"><span class="badge">מגרש ${m+1}</span></div><div class="vsr"><div class="team2">${pp(i,deal)}${pp(i+1,deal)}${rep(i)}</div><div class="mid"><div class="vs">V/S</div></div><div class="team2">${pp(i+2,deal)}${pp(i+3,deal)}${rep(i+2)}</div></div><div class="ctl" style="margin-top:10px">${b('הזן תוצאה',`data-act="enter" data-m="${m}"`)}</div></div>`}
  if(o.length>k*4)h+=`<div class="match"><div class="mt"><span class="badge">מנוחה</span></div><div class="bench">${o.slice(k*4).map((_,j)=>pp(k*4+j,deal)).join('')}</div></div>`;
  h+=`</div><div class="ctl">${B('ערבב קלפים','data-act="shuf"')}${r.shuf?b('סיבוב נוסף','data-act="shuf"','ghost'):''}${b('תוצאה ידנית','data-act="manual"','ghost')}</div>`;
  $('#pr').innerHTML=h;
}

  addmatch:d=>{if(needLogin()){S.afterLogin=()=>matchSheet(d.id);return}matchSheet(d.id)},

  editphoto:async d=>{const r=await editAvatar(d.id);if(r)saveAvatar(d.id,r)},
  pairs:d=>{if(needLogin()){S.afterLogin=()=>pairSheet(d.id);return}pairSheet(d.id)},
  swap:d=>{const r=S.pr,i=+d.i;if(r.busy)return;if(r.sel===null)r.sel=i;else if(r.sel===i)r.sel=null;else{[r.order[r.sel],r.order[i]]=[r.order[i],r.order[r.sel]];r.sel=null}renderPair()},
  enter:d=>{const r=S.pr,i=+d.m*4;matchSheet(r.eid,null,r.order.slice(i,i+4))},
  manual:()=>matchSheet(S.pr.eid),
  shuf:async()=>{const r=S.pr;if(r.busy)return;r.busy=true;r.sel=null;
    $('#pr').innerHTML=`<p class="sub">מערבב...</p><div class="deck" id="deck">${r.order.map(()=>`<div class="pc">${ic('ball',26)}</div>`).join('')}</div>`;
    const cards=[...document.querySelectorAll('#deck .pc')];
    for(let t=0;t<8;t++){cards.forEach(c=>{c.style.transform=`translate(${(Math.random()-.5)*150}px,${(Math.random()-.5)*60}px) rotate(${(Math.random()-.5)*50}deg)`});await sleep(170)}
    cards.forEach(c=>c.style.transform='');await sleep(220);
    const pl=playedPairs(r.eid),cur=r.order.join();let best=null,bs=1e9;
    for(let t=0;t<300;t++){const o=r.order.slice();for(let i=o.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[o[i],o[j]]=[o[j],o[i]]}
      const sc=repeats(o,pl)*10+(o.join()===cur?5:0);if(sc<bs){bs=sc;best=o}if(bs===0)break}
    r.order=best;r.shuf=true;r.busy=false;renderPair(true)},
  cover:async d=>{if(needLogin())return;const img=await pickImage(800);if(!img)return;

  chpw:async d=>{const pw=$('#np').value.trim();if(!pw){toast('כתוב סיסמה חדשה',1);return}

  adj:d=>{S.ad[d.k]+=+d.d;$('#oa'+d.k).textContent=S.ad[d.k]},

  phone:d=>phoneSheet(d.id),
  savephone:async()=>{const id=S.phoneFor,c=S.contacts.find(x=>x.player_id===id)||{};
    try{const setPw=!c.has_pw;
      await rpc('padel_admin_set_phone',{p_token:S.token,p_player:id,p_phone:$('#ph').value,p_set_pw:setPw});
      S.contacts=await rpc('padel_admin_contacts',{p_token:S.token});closeSheet();renderAdmin();
      const n=S.contacts.find(x=>x.player_id===id);
      const w=window.open(waLink(P(id),n),'_blank');toast(w?'נפתח וואטסאפ':'המספר נשמר, לחץ על שלח')}catch(e){toast(e.message,1)}},
  saveNew:async()=>{const n=$('#apn').value.trim();
    try{const id=await rpc('padel_save_player',{p_token:S.token,p_id:null,p_name:n,p_photo:S.newPhoto});if(S.newPhoto&&S.newSrc)await rpc('padel_save_avatar',{p_token:S.token,p_id:id,p_photo:S.newPhoto,p_src:S.newSrc});await loadAll();
      if(S.apBack==='ev'){const keep=[...(S.sel||[])];keep.push(id);const e=S.editEv?S.evenings.find(x=>x.id===S.editEv):null;evSheet(e);keep.forEach(k=>S.sel.add(k));$('#pg').innerHTML=pickGrid([...S.sel])}
      else{closeSheet();route()}toast('נוסף')}catch(e){toast(e.message,1)}},
  addphoto:async d=>{if(needLogin())return;const img=await pickImage(1000);if(!img)return;
    try{await rpc('padel_add_photo',{p_token:S.token,p_evening:d.id,p_data:img});toast('התמונה עלתה');loadPhotos(d.id)}catch(e){toast(e.message,1)}},
  viewphoto:d=>{const src=document.querySelector(`img[data-id="${d.id}"]`).src;const ok=S.me&&(S.me.admin||S.me.id===d.by);
    sheet(`<img src="${src}" style="width:100%;border-radius:18px"><div class="ctl">${S.me?b(ic('image',16)+'הגדר כקאבר',`data-act="setcover" data-id="${d.id}"`):''}${ok?b(ic('trash',16)+'מחק תמונה',`data-act="delphoto" data-id="${d.id}"`,'red'):''}${b('סגור','data-act="close"','ghost')}</div>`)},
  delphoto:async d=>{try{await rpc('padel_delete_photo',{p_token:S.token,p_id:d.id});closeSheet();route()}catch(e){toast(e.message,1)}}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;const f=A[t.dataset.act];if(f){e.preventDefault();f({...t.dataset})}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&$('#pw'))doLogin()});

function bindTilt(){
  document.querySelectorAll('.tilt').forEach(el=>{if(el._t)return;el._t=1;
    const mv=e=>{const r=el.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
      el.style.transform=`perspective(600px) rotateY(${(x-.5)*18}deg) rotateX(${(.5-y)*14}deg) scale(1.03)`;el.style.setProperty('--mx',x*100+'%');el.style.setProperty('--my',y*100+'%')};
    const rs=()=>{el.style.transform='';el.style.setProperty('--mx','50%');el.style.setProperty('--my','0%')};
    el.addEventListener('pointermove',mv);el.addEventListener('pointerleave',rs);el.addEventListener('pointerup',()=>setTimeout(rs,250))});
}
(async()=>{try{await Promise.all([loadAll(),initSession()]);route()}catch{$('#app').innerHTML='<div class="empty">לא הצלחתי לטעון. בדקו חיבור ורעננו</div>'}})();
</script>
